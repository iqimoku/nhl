name: Raport NHL

on:
  schedule:
    # godziny w UTC (GitHub nie zna czasu polskiego):
    #   10:00 UTC = 11:00 w Polsce zimą (12:00 latem) – raport poranny
    #   17:00 UTC = 18:00 w Polsce zimą (19:00 latem) – raport wieczorny: składy po porannych treningach
    # GitHub potrafi opóźnić start o 5–30 min, więc to „około” tej godziny.
    - cron: "0 10 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data meczów RRRR-MM-DD (puste = dziś)"
        required: false
        default: ""

# Bezpieczeństwo: domyślnie brak uprawnień; zadanie dostaje tylko zapis treści repozytorium (commit raportu).
permissions: {}

concurrency:
  group: raport-nhl
  cancel-in-progress: false

jobs:
  raport:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      # akcje przypięte do konkretnych commitów (nie da się ich podmienić pod tym samym numerem wersji)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalacja
        run: pip install --disable-pip-version-check -r requirements.txt

      # dane z zakończonych sezonów zapisują się między uruchomieniami – kolejne przebiegi trwają ~1 min
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: nhl-cache-${{ github.run_id }}
          restore-keys: nhl-cache-

      - name: Model
        env:
          DATE_IN: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$DATE_IN" ]; then
            # tylko format RRRR-MM-DD – nic innego nie trafia do komendy
            if ! [[ "$DATE_IN" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "Zła data: użyj RRRR-MM-DD"; exit 1; fi
            python nhl_model.py --site docs --no-open --date "$DATE_IN"
          else
            python nhl_model.py --site docs --no-open
          fi

      - name: Zapis do repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Brak zmian."
          else
            git commit -m "Raport NHL $(date -u +%F)"
            git pull --rebase
            git push
          fi

name: Backtest NHL

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Od (RRRR-MM-DD)"
        required: true
        default: "2022-10-01"
      end:
        description: "Do (RRRR-MM-DD)"
        required: true
        default: "2026-04-20"

# Bezpieczeństwo: domyślnie brak uprawnień; zadanie dostaje tylko zapis treści (commit pliku calibration.json).
permissions: {}

concurrency:
  group: backtest-nhl
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      # dane z formularza trafiają do skryptu wyłącznie jako zmienne środowiskowe, nigdy wprost do komend
      START: ${{ github.event.inputs.start }}
      END: ${{ github.event.inputs.end }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Sprawdzenie dat
        run: |
          for d in "$START" "$END"; do
            if ! [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "Zła data '$d': użyj RRRR-MM-DD"; exit 1; fi
          done

      - name: Instalacja
        run: pip install --disable-pip-version-check -r requirements.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: nhl-cache-bt-${{ github.run_id }}
          restore-keys: |
            nhl-cache-bt-
            nhl-cache-

      - name: Backtest
        run: |
          python nhl_model.py --backtest "$START" "$END" --out raporty | tee backtest.txt
          {
            echo "## Backtest $START → $END"
            echo '```'
            sed -n '/^Uczę/,$p' backtest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zapis kalibracji do repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add calibration.json
          if git diff --cached --quiet; then
            echo "Kalibracja bez zmian."
          else
            git commit -m "Kalibracja z backtestu $START – $END"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backtest-wyniki
          path: |
            backtest.txt
            raporty/backtest_*.csv
            calibration.json
